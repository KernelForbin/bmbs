name: Auto-fix a Picks Parse Failure

# Fires when either parse workflow fails. Investigates with ONE bounded
# Claude API call (scripts/auto_fix_parser.py) -- not an autonomous agent,
# see CLAUDE.md's "Discord status automation" section for why that
# distinction matters here. Commits the fix ONLY if the full test suite
# still passes AND the specific failing upload now parses; otherwise it
# edits the Discord status message to say so and touches nothing.
#
# Security note: steps.fix.outputs.summary is text a MODEL wrote after
# reading a friend's raw Discord upload -- neither is a trusted input.
# Every use of it below goes through `env:` + a quoted shell variable,
# never spliced directly into a run: script via ${{ }} -- that would be a
# classic GitHub Actions script-injection hole (the substitution happens
# before the shell ever sees it, so shell metacharacters in the value
# could alter what the script does). Same for the Discord message text.

on:
  workflow_run:
    workflows: ["Parse New Picks", "Parse New Football Picks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sport:
        description: "Which sport to (re-)attempt (manual runs only)"
        required: true
        type: choice
        options: [baseball, football]

permissions:
  contents: write

concurrency:
  group: ${{ (github.event.workflow_run.name == 'Parse New Football Picks' || github.event.inputs.sport == 'football') && 'parse-football-picks' || 'parse-picks' }}
  cancel-in-progress: false

jobs:
  auto-fix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # The branch the failing run was on (always main in practice), or the
      # branch a manual dispatch was fired from. NOT hardcoded to main: that
      # made it impossible to exercise this workflow end to end before merging
      # it, because a branch run would still check out main's old scripts.
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out who uploaded the card
        id: who
        env:
          HEAD_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          # The Discord bot writes "[discord:<id>]" into the commit message,
          # because a USERNAME can't be mentioned -- Discord needs the id --
          # and the commit is the only channel between the bot and a workflow.
          # Absent (a web-editor upload, or a bot that hasn't been restarted
          # since this was added) simply means no mention.
          ID=$(printf '%s' "$HEAD_MSG" | grep -oE 'discord:[0-9]+' | head -1 | cut -d: -f2 || true)
          echo "uploader=$ID" >> "$GITHUB_OUTPUT"
          echo "Uploader id: ${ID:-(none)}"

      - name: Determine which sport failed
        id: sport
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          DISPATCH_SPORT: ${{ github.event.inputs.sport }}
        run: |
          if [ "$WORKFLOW_NAME" = "Parse New Football Picks" ] || [ "$DISPATCH_SPORT" = "football" ]; then
            echo "sport=football" >> "$GITHUB_OUTPUT"
            echo "incoming=data/football/incoming_picks.txt" >> "$GITHUB_OUTPUT"
            echo "parser=scripts/parse_football_picks.py" >> "$GITHUB_OUTPUT"
            echo "tickets=data/football/tickets.json" >> "$GITHUB_OUTPUT"
            echo "previous=data/football/tickets-previous.json" >> "$GITHUB_OUTPUT"
          else
            echo "sport=baseball" >> "$GITHUB_OUTPUT"
            echo "incoming=data/incoming_picks.txt" >> "$GITHUB_OUTPUT"
            echo "parser=scripts/parse_picks.py" >> "$GITHUB_OUTPUT"
            echo "tickets=data/tickets.json" >> "$GITHUB_OUTPUT"
            echo "previous=data/tickets-previous.json" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error, and the script exits 0 on a failed notification too.
      # On 2026-09-22 a 403 here killed the job at step 4 of 8: the picks were
      # never repaired AND the group got no message at all. A status ping is
      # decoration; it must never be able to veto the actual work.
      - name: Tell Discord the fix is under way
        continue-on-error: true
        env:
          DISCORD_STATUS_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
          SPORT: ${{ steps.sport.outputs.sport }}
        run: |
          python scripts/notify_discord.py post --text "⏳ Working on the ${SPORT} card — it didn't parse on the first pass, so I'm attempting an automatic fix now. I'll post an update here shortly."

      - name: Install test dependencies
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Attempt an automatic fix
        id: fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPORT: ${{ steps.sport.outputs.sport }}
          INCOMING: ${{ steps.sport.outputs.incoming }}
          PARSER: ${{ steps.sport.outputs.parser }}
        run: python scripts/auto_fix_parser.py

      - name: Commit and push the automatic fix
        id: commit
        if: steps.fix.outputs.resolved == 'yes'
        env:
          PARSER: ${{ steps.sport.outputs.parser }}
          TICKETS: ${{ steps.sport.outputs.tickets }}
          PREVIOUS: ${{ steps.sport.outputs.previous }}
          SUMMARY: ${{ steps.fix.outputs.summary }}
        run: |
          git config user.name "hr-checklist-bot"
          git config user.email "actions@users.noreply.github.com"
          # Rebase onto whatever branch we actually checked out, NOT a hardcoded
          # main: the checkout above follows workflow_run.head_branch, so on a
          # test branch "git pull --rebase origin main" tries to replay the whole
          # branch onto main and conflicts with every file the branch added.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git add "$PARSER" "$TICKETS" "tests/fixtures/"
          [ -f "$PREVIOUS" ] && git add "$PREVIOUS"
          git commit -m "Auto-fix: $SUMMARY"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing and retrying..."
            git pull --rebase origin "$BRANCH"
            sleep 3
          done
          echo "Failed to push after retries." >&2
          exit 1

      - name: Post the outcome as a NEW Discord message
        if: always()
        continue-on-error: true
        env:
          DISCORD_STATUS_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
          UPLOADER: ${{ steps.who.outputs.uploader }}
          SPORT: ${{ steps.sport.outputs.sport }}
          RESOLVED: ${{ steps.fix.outputs.resolved }}
          # steps.commit.outcome is 'skipped' (not 'success') whenever the
          # commit step's own `if:` was false, i.e. resolved != 'yes' -- so
          # checking BOTH here is what stops a fix that was found but then
          # failed to actually push (a git conflict outlasting the retries,
          # say) from being reported as "live" when it never landed.
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          # 'transport' means every attempt died before the model answered, so
          # the upload was never actually judged -- see below.
          REASON: ${{ steps.fix.outputs.reason }}
        run: |
          if [ "$RESOLVED" = "yes" ] && [ "$COMMIT_OUTCOME" = "success" ]; then
            TEXT="✅ Fixed automatically — your ${SPORT} card is parsed and live on bmbs.bet."
          elif [ "$RESOLVED" = "yes" ]; then
            TEXT="⚠️ Found a fix for the ${SPORT} upload but couldn't push it -- needs a look. Check the Actions tab."
          elif [ "$REASON" = "transport" ]; then
            # Do NOT say the card couldn't be parsed: nothing ever read it.
            # Saying so once sent someone rewriting a card that was fine.
            TEXT="⚠️ Couldn't reach the fixer service for the ${SPORT} upload -- the card itself hasn't been checked yet. Retrying is usually enough; check the Actions tab."
          elif [ "$REASON" = "notbroken" ]; then
            # The fixer found nothing to repair. Never report this as a fix:
            # a run that changed nothing once announced "picks are live".
            TEXT="ℹ️ Nothing to fix for the ${SPORT} upload -- it already parses with the current parser. No changes were made."
          elif [ "$REASON" = "nokey" ]; then
            TEXT="⚠️ The ${SPORT} upload needs a look -- the automatic fixer isn't configured (no API key)."
          else
            TEXT="❌ Couldn't fix the ${SPORT} card automatically after several attempts — it needs a human look now. The full error is in the Actions tab."
          fi
          # A NEW message, never an edit. Editing the earlier one changes no
          # timestamp and pings nobody, so there was no way to tell WHEN a
          # card went live -- which is the whole reason this reports back.
          python scripts/notify_discord.py post --text "$TEXT" --mention "$UPLOADER"
