name: Import History

# Refreshes data/history.json (the History page's only data source) from the
# group's tracking sheet. Runs once a day at a quiet hour, well away from the
# evening picks upload, so it doesn't race parse-picks.yml for the push.
# It writes data/history.json and nothing else -- never the tickets files.

on:
  schedule:
    - cron: "0 13 * * *"   # 9am ET (8am in winter): last night's slate has been marked by then
  workflow_dispatch: {}     # manual run from the Actions tab, e.g. right after fixing the sheet

permissions:
  contents: write

concurrency:
  group: import-history
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only. Any failure (sheet unreachable, layout changed,
      # MLB down, history would shrink) exits non-zero here, before anything
      # is committed, so the page keeps serving yesterday's good file.
      - name: Import the sheet into data/history.json
        run: python scripts/import_history.py

      - name: Commit and push if changed
        run: |
          git config user.name "hr-checklist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "History unchanged."
            exit 0
          fi
          git commit -m "Import history -> history.json $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing and retrying..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Failed to push after retries." >&2
          exit 1
