name: Parse New College Football Picks

# The college-football tracker at /cfb/ (hidden from the sport switch, 2026-10-05). A
# cfb_*.txt upload lands in data/cfb/incoming_picks.txt and is parsed
# here; the same shape as the other parse workflows, in its own lane.

on:
  push:
    branches: [main]
    paths:
      - "data/cfb/incoming_picks.txt"
  workflow_dispatch: {}   # manual re-run from the Actions tab if ever needed

permissions:
  contents: write

concurrency:
  group: parse-cfb-picks
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The live slate as it stands BEFORE this parse. If the new card is the
      # same slate, the Discord ping says it was UPDATED (and what changed)
      # instead of announcing it as newly live. Absent is fine: a first card.
      - name: Keep the live slate as it was
        run: cp data/cfb/tickets.json "$RUNNER_TEMP/live-before.json" 2>/dev/null || true

      - name: Parse data/cfb/incoming_picks.txt into data/cfb/tickets.json
        run: python scripts/parse_cfb_picks.py --file data/cfb/incoming_picks.txt

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "hr-checklist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cfb/tickets.json
          [ -f data/cfb/tickets-previous.json ] && git add data/cfb/tickets-previous.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Parse new college football picks -> data/cfb/tickets.json $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              echo "committed=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing and retrying..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Failed to push after retries." >&2
          exit 1

      - name: Work out who uploaded the card
        id: who
        run: |
          # The Discord bot writes "[discord:<id>]" into the commit message,
          # because a USERNAME can't be mentioned -- Discord needs the id --
          # and the commit is the only channel between the bot and a workflow.
          # Absent (a web-editor upload, or a bot not yet restarted since that
          # was added) simply means no mention, not a failure.
          ID=$(printf '%s' "$HEAD_MSG" | grep -oE 'discord:[0-9]+' | head -1 | cut -d: -f2 || true)
          echo "uploader=$ID" >> "$GITHUB_OUTPUT"
          echo "Uploader id: ${ID:-(none)}"
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}

      # Only on a genuine new slate, never a no-op rerun. A status ping must
      # not be able to turn a successful upload into a red run.
      - name: Notify Discord that the college slate is live
        continue-on-error: true
        if: steps.commit.outputs.committed == 'yes'
        env:
          DISCORD_STATUS_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
        run: python scripts/notify_discord.py success --tickets data/cfb/tickets.json --sport cfb --mention "${{ steps.who.outputs.uploader }}" --before "$RUNNER_TEMP/live-before.json"

      # This league has no auto-fixer (auto-fix-parse-failure.yml covers MLB,
      # NFL and All Sports only), so without this a card that won't parse
      # fails in silence and the group is never told.
      - name: Tell Discord the card didn't go through
        if: failure()
        continue-on-error: true
        env:
          DISCORD_STATUS_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
        run: python scripts/notify_discord.py post --text "The college football card couldn't be processed, so https://bmbs.bet/cfb/ is unchanged. Check the card's format, or the Actions log, and upload it again."
