<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Run Card — Live Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F0E; --panel: #131A18; --panel-line: #223028;
    --green: #3ECF8E; --green-dim: #1E4A38;
    --red: #E5636B; --red-dim: #4A2226;
    --amber: #E8B858; --text: #EDF2F0; --text-dim: #9AAAA3; --text-faint: #5E6E67;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; }
  body { display:flex; justify-content:center; padding:24px 12px 56px; }
  .card { width:100%; max-width:560px; }
  header { padding:4px 4px 18px; border-bottom:1px solid var(--panel-line); margin-bottom:20px; }
  .eyebrow { font-family:'Oswald',sans-serif; font-size:13px; font-weight:600; letter-spacing:.14em; color:var(--green); margin:0 0 6px; display:flex; align-items:center; gap:8px; }
  .live-dot { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  h1 { font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; line-height:1.1; margin:0 0 10px; }
  .note { font-size:13.5px; line-height:1.5; color:var(--text-dim); margin:0 0 4px; }
  .note b { color:var(--text); font-weight:600; }
  .sync-line { font-size:11px; color:var(--text-faint); margin-top:10px; }
  .scoreboard { display:flex; gap:10px; margin-top:14px; }
  .score-chip { flex:1; background:var(--panel); border:1px solid var(--panel-line); border-radius:8px; padding:9px 8px; text-align:center; }
  .score-chip .num { font-family:'Oswald',sans-serif; font-size:19px; font-weight:700; }
  .score-chip .lbl { font-size:10.5px; color:var(--text-faint); letter-spacing:.06em; margin-top:2px; }
  .score-chip.hit .num { color:var(--green); }
  .score-chip.miss .num { color:var(--red); }
  .score-chip.pending .num { color:var(--text); }
  .window { margin-bottom:28px; }
  .window-title { font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; display:flex; align-items:baseline; gap:10px; margin:0 0 12px; padding:0 2px; }
  .window-title .dot { width:7px; height:7px; border-radius:50%; background:var(--green); flex:none; transform:translateY(-2px); }
  .ticket { background:var(--panel); border:1px solid var(--panel-line); border-radius:10px; padding:14px 14px 12px; margin-bottom:12px; }
  .ticket-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .ticket-name { font-family:'Oswald',sans-serif; font-size:14.5px; font-weight:600; color:var(--green); }
  .ticket-sub { font-size:12px; color:var(--text-faint); font-weight:500; }
  .leg { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--panel-line); }
  .leg:first-of-type { border-top:none; padding-top:0; }
  .leg-left { flex:1; min-width:0; }
  .leg-player { font-size:14px; font-weight:600; line-height:1.35; word-wrap:break-word; }
  .leg-meta { font-size:12px; color:var(--text-dim); line-height:1.4; margin-top:2px; word-wrap:break-word; }
  .leg-right { flex:none; text-align:right; }
  .leg-odds { font-family:'Oswald',sans-serif; font-size:13.5px; font-weight:600; color:var(--amber); }
  .leg-time { font-size:11px; color:var(--text-faint); margin-top:2px; }
  .mark-badge { flex:none; width:34px; height:34px; border-radius:9px; border:1.5px solid var(--panel-line); display:flex; align-items:center; justify-content:center; }
  .mark-badge svg { width:17px; height:17px; display:block; }
  .mark-badge .check-path, .mark-badge .x-path { display:none; }
  .mark-badge[data-state="pending"] .dash { display:block; }
  .mark-badge[data-state="hit"] { background:var(--green-dim); border-color:var(--green); }
  .mark-badge[data-state="hit"] .check-path { display:block; stroke:var(--green); }
  .mark-badge[data-state="miss"] { background:var(--red-dim); border-color:var(--red); }
  .mark-badge[data-state="miss"] .x-path { display:block; stroke:var(--red); }
  .mark-badge .dash { stroke:var(--text-faint); }
  .leg.state-hit .leg-player { color:var(--green); }
  .leg.state-miss .leg-player { color:var(--text-faint); text-decoration:line-through; }
  .leg.state-miss .leg-meta, .leg.state-miss .leg-odds { color:var(--text-faint); }
  .ticket-foot { margin-top:10px; padding-top:10px; border-top:1px solid var(--panel-line); font-size:12.5px; color:var(--text-dim); line-height:1.5; }
  .ticket-foot b { color:var(--text); font-weight:600; }
  .ticket-status { font-size:11px; font-weight:600; letter-spacing:.04em; margin-top:6px; }
  .ticket-status.win { color:var(--green); }
  .ticket-status.dead { color:var(--red); }
  .ticket-status.live { color:var(--text-dim); }
  .divider { text-align:center; color:var(--text-faint); font-size:12px; margin:24px 0; letter-spacing:.08em; }
  .singles-title { font-family:'Oswald',sans-serif; font-size:17px; font-weight:700; margin:0 0 4px; }
  .singles-sub { font-size:13px; color:var(--text-dim); margin:0 0 14px; }
  .single-row { display:flex; align-items:center; gap:10px; padding:10px 4px; border-top:1px solid var(--panel-line); }
  .single-row:first-of-type { border-top:none; }
  .single-left { flex:1; min-width:0; }
  .single-person { font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; color:var(--green); letter-spacing:.03em; margin-bottom:2px; }
  .single-player { font-size:14px; font-weight:600; line-height:1.35; word-wrap:break-word; }
  .single-meta { font-size:11.5px; color:var(--text-dim); line-height:1.4; margin-top:2px; word-wrap:break-word; }
  .single-right { flex:none; text-align:right; }
  .single-row.state-hit .single-player { color:var(--green); }
  .single-row.state-miss .single-player { color:var(--text-faint); text-decoration:line-through; }
  .single-row.state-miss .single-meta { color:var(--text-faint); }
  footer { margin-top:18px; padding-top:14px; border-top:1px solid var(--panel-line); font-size:11px; color:var(--text-faint); text-align:center; }
  .err { background:var(--red-dim); border:1px solid var(--red); color:var(--text); border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="card">
  <header>
    <p class="eyebrow"><span class="live-dot"></span>TONIGHT'S SLATE &middot; AUTO-UPDATING</p>
    <h1>Home Run Card</h1>
    <p class="note" id="dynamic-note"></p>
    <p class="sync-line" id="sync-line">Loading live results&hellip;</p>
    <div class="scoreboard">
      <div class="score-chip hit"><div class="num" id="count-hit">0</div><div class="lbl">HIT</div></div>
      <div class="score-chip miss"><div class="num" id="count-miss">0</div><div class="lbl">MISS</div></div>
      <div class="score-chip pending"><div class="num" id="count-pending">0</div><div class="lbl">LIVE</div></div>
    </div>
  </header>
  <div id="err-box"></div>
  <div id="content"></div>
  <footer id="footer-line">all times ET &middot; results pulled from MLB Stats API</footer>
</div>

<script>
const REFRESH_MS = 60000; // poll marks.json every 60s
let TICKETS = null;
let MARKS = {};

const btnSvg = `
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line class="dash" x1="7" y1="12" x2="17" y2="12" stroke-width="2" stroke-linecap="round"/>
    <path class="check-path" d="M5 12.5L9.5 17L19 7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="x-path" d="M6 6L18 18M18 6L6 18" stroke-width="2.3" stroke-linecap="round"/>
  </svg>`;

function badge(id) {
  const state = MARKS[id] || "pending";
  return `<div class="mark-badge" data-state="${state}">${btnSvg}</div>`;
}

function render() {
  if (!TICKETS) return;
  document.getElementById("dynamic-note").innerHTML =
    `<b>Auto-tracked</b> \u2014 ${TICKETS.note || ""}`;

  const root = document.getElementById("content");
  let html = "";

  TICKETS.windows.forEach((win) => {
    html += `<div class="window"><p class="window-title"><span class="dot"></span>${win.title}</p>`;
    win.tickets.forEach((tk) => {
      const legIds = tk.legs.map(l => l.id);
      html += `<div class="ticket"><div class="ticket-head"><span class="ticket-name">${tk.name}</span><span class="ticket-sub">${tk.sub}</span></div>`;
      tk.legs.forEach((leg) => {
        const state = MARKS[leg.id] || "pending";
        html += `<div class="leg state-${state}">
          <div class="leg-left"><div class="leg-player">${leg.player}</div><div class="leg-meta">${leg.meta}</div></div>
          <div class="leg-right"><div class="leg-odds">${leg.odds}</div><div class="leg-time">${leg.time}</div></div>
          ${badge(leg.id)}
        </div>`;
      });
      const states = legIds.map(id => MARKS[id] || "pending");
      let statusText = "", statusCls = "live";
      if (states.some(s => s === "miss")) { statusText = "DEAD"; statusCls = "dead"; }
      else if (states.every(s => s === "hit")) { statusText = "HIT \u2014 CASH"; statusCls = "win"; }
      else { statusText = `${states.filter(s => s === "hit").length}/${states.length} live`; }
      html += `<div class="ticket-foot">${tk.foot}<div class="ticket-status ${statusCls}">${statusText}</div></div></div>`;
    });
    html += `</div>`;
  });

  html += `<div class="divider">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</div>
    <div class="window"><p class="singles-title">Single Bets Tracker</p><p class="singles-sub">One player prop per person, straight bet.</p><div class="ticket" style="padding-top:4px;padding-bottom:4px;">`;
  TICKETS.singles.forEach((s) => {
    const state = MARKS[s.id] || "pending";
    html += `<div class="single-row state-${state}">
      <div class="single-left"><div class="single-person">${s.who}</div><div class="single-player">${s.player}</div><div class="single-meta">${s.meta}</div></div>
      <div class="single-right"><div class="leg-odds">${s.odds}</div><div class="leg-time">${s.pp}</div></div>
      ${badge(s.id)}
    </div>`;
  });
  html += `</div></div>`;

  root.innerHTML = html;
  updateCounts();
}

function updateCounts() {
  const states = Object.values(MARKS);
  const hit = states.filter(s => s === "hit").length;
  const miss = states.filter(s => s === "miss").length;
  const total = countAllLegs();
  document.getElementById("count-hit").textContent = hit;
  document.getElementById("count-miss").textContent = miss;
  document.getElementById("count-pending").textContent = Math.max(0, total - hit - miss);
}

function countAllLegs() {
  if (!TICKETS) return 0;
  let n = 0;
  TICKETS.windows.forEach(w => w.tickets.forEach(t => n += t.legs.length));
  n += TICKETS.singles.length;
  return n;
}

async function loadTickets() {
  const res = await fetch("data/tickets.json", { cache: "no-store" });
  if (!res.ok) throw new Error("tickets.json failed to load");
  TICKETS = await res.json();
}

async function loadMarks() {
  try {
    const res = await fetch("data/marks.json", { cache: "no-store" });
    if (!res.ok) throw new Error("marks.json not found yet");
    const payload = await res.json();
    MARKS = payload.marks || {};
    const updated = payload.updated_at ? new Date(payload.updated_at) : null;
    document.getElementById("sync-line").textContent = updated
      ? `Last synced ${updated.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })} ET`
      : "Synced";
    document.getElementById("err-box").innerHTML = "";
  } catch (e) {
    document.getElementById("sync-line").textContent = "Waiting on first sync from the pipeline\u2026";
    document.getElementById("err-box").innerHTML =
      `<div class="err">No results file yet. This shows once the GitHub Action runs and commits data/marks.json.</div>`;
  }
}

async function init() {
  try {
    await loadTickets();
  } catch (e) {
    document.getElementById("err-box").innerHTML = `<div class="err">Could not load data/tickets.json. Check the file exists and is valid JSON.</div>`;
    return;
  }
  await loadMarks();
  render();
  setInterval(async () => { await loadMarks(); render(); }, REFRESH_MS);
}

init();
</script>
</body>
</html>
